name: Construire APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Construire
        run: |
          flutter create --platforms=android livreur_app
          cp livreur_main.dart livreur_app/lib/main.dart
          cp livreur_pubspec.yaml livreur_app/pubspec.yaml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application#' livreur_app/android/app/src/main/AndroidManifest.xml
          cd livreur_app
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: application-livreur
          path: livreur_app/build/app/outputs/flutter-apk/app-release.apk
