{% extends "base.html" %}
{% block title %}Connexion - Nimba Livraison{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:65vh">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div style="font-size:3rem">📦</div>
            <h1 class="fw-bold">Nimba Livraison</h1>
            <p class="text-muted">Connectez-vous à votre espace</p>
        </div>

        <div class="card p-4">
            <form method="POST">
                {{ csrf_token() }}

                <div class="mb-3">
                    <label class="form-label">Identifiant</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Se connecter
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
